  Hoje qualquer pessoa pode acessar `/uploads/*` sem autenticação.

  Remover:
  ```ts
  app.use("/uploads", express.static(...));
  ```

  Substituir por endpoint autenticado:
  ```ts
  router.get("/:id/photos/:filename",
    requireAuth,
    requirePermission("View Cow"),
    async (req, res) => {
      res.sendFile(path.resolve(process.cwd(), "uploads", req.params.filename));
    }
  );
  ```
