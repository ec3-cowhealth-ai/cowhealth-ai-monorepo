  O professor quer "telas para todos os roles implementadas". Hoje qualquer
  usuário logado vê todos os botões de criar/editar/deletar. Um VIEWER não
  deveria ver essas ações.

  O hook `useHasPermission` já existe em `frontend/src/hooks/usePermission.ts`.
