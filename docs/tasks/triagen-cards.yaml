version: 2
id: 5
title: "IAN — Bottom nav: suporte iOS e Android correto"
list: "Up next"
priority: High
risk: Low
labels:
  - frontend
  - mobile
description: |
  O CSS atual tem padding-bottom com safe-area mas a barra fica com altura
  fixa em 64px, causando dois problemas:

  - iOS (notch/Dynamic Island): ícones ficam espremidos atrás do home indicator
  - Android (gesture navigation): barra cortada em dispositivos sem botões físicos

  Arquivos: `frontend/src/styles/App.css` + `frontend/src/components/layout/BottomNav.tsx`

  Correção no CSS:
  ```css
  .bottom-nav {
    padding-bottom: env(safe-area-inset-bottom, 0px);
    height: calc(64px + env(safe-area-inset-bottom, 0px));
    -webkit-transform: translateZ(0);
  }
  .bottom-nav__item {
    height: 64px;
    align-self: start;
  }
  ```
checklists:
