version: 2
id: 13
title: "RENATO — requirePermission sem DB query por request"
list: "Backlog"
priority: Medium
risk: Medium
labels:
  - backend
  - refactor
description: |
  Hoje `requirePermission` faz uma query ao banco a cada request autenticado.
  Embutir `permissions[]` no payload JWT no login para eliminar a query.

  Em `backend/src/services/authService.ts`:
  ```ts
  const permissions = await prisma.permission.findMany({
    where: { roles: { some: { users: { some: { userId: user.id } } } } },
    select: { name: true },
  });
  const token = jwt.sign(
    { sub: user.id, permissions: permissions.map(p => p.name) },
    SECRET
  );
  ```

  No middleware `requirePermission.ts`:
  ```ts
  const allowed = request.user?.permissions?.includes(permissionName) ?? false;
  ```
