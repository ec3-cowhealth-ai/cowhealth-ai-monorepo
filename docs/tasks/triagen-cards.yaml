id: 11
title: "RENATO — Global error handler no Express"
list: "Backlog"
priority: Medium
risk: Low
labels:
  - backend
description: |
  Arquivo: `backend/src/server.ts`

  Adicionar antes do `app.listen`:
  ```ts
  app.use((err: Error, _req: Request, res: Response, _next: NextFunction) => {
    console.error(err);
    res.status(500).json({ error: "Internal server error" });
  });
  ```

  Isso evita que stacktraces vazem para o cliente em caso de erro não tratado.
