<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CowHealth AI — Hi-Fi Mockups</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
  body { background: var(--bg-canvas); color: var(--text-primary); font-family: var(--font-body); }
  .legend { position: fixed; left: 16px; top: 16px; z-index: 100; background: rgba(19,21,21,0.85); backdrop-filter: blur(14px); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; max-width: 320px; pointer-events: none; }
  .legend h1 { font-family: var(--font-display); font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .legend p { margin: 6px 0 0; font-size: 12px; color: var(--text-secondary); line-height: 1.45; }
  .legend .swatches { display: flex; gap: 6px; margin-top: 10px; }
  .legend .sw { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--border-subtle); }
</style>
</head>
<body>
<div id="root"></div>

<div class="legend">
  <h1>CowHealth <span style="color:var(--accent)">AI</span> — UI Kit</h1>
  <p>12 telas hi-fi · iPhone 14 Pro (390×844) · Dark · PT-BR. Arraste o canvas, role para zoom, clique numa tela para ampliar.</p>
  <div class="swatches">
    <span class="sw" style="background:#131515" title="Onyx"></span>
    <span class="sw" style="background:#2B2C28" title="Graphite"></span>
    <span class="sw" style="background:#339989" title="Verdigris"></span>
    <span class="sw" style="background:#7DE2D1" title="Pearl Aqua"></span>
    <span class="sw" style="background:#FFFAFB" title="Snow"></span>
  </div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens-1.jsx"></script>
<script type="text/babel" src="screens-2.jsx"></script>
<script type="text/babel" src="screens-3.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { DesignCanvas, DCSection, DCArtboard } = window;

function Frame({ time, children, label }) {
  return <PhoneFrame time={time}>{children}</PhoneFrame>;
}

function App() {
  return (
    <DesignCanvas title="CowHealth AI — Hi-Fi Mockups" subtitle="Sheet 1 of 1 · v1.0 · 2026-05-08">
      <DCSection id="auth" title="Onboarding & Acesso">
        <DCArtboard id="splash" label="01 · Splash" width={414} height={868}>
          <Frame time="08:42"><SplashScreen/></Frame>
        </DCArtboard>
        <DCArtboard id="onboarding" label="02 · Onboarding" width={414} height={868}>
          <Frame time="08:42"><OnboardingScreen/></Frame>
        </DCArtboard>
        <DCArtboard id="login" label="03 · Login" width={414} height={868}>
          <Frame time="08:42"><LoginScreen/></Frame>
        </DCArtboard>
      </DCSection>

      <DCSection id="core" title="Núcleo do app">
        <DCArtboard id="home" label="04 · Home / Dashboard" width={414} height={868}>
          <Frame time="08:43"><HomeScreen/></Frame>
        </DCArtboard>
        <DCArtboard id="herd" label="05 · Rebanho" width={414} height={868}>
          <Frame time="08:43"><HerdScreen/></Frame>
        </DCArtboard>
        <DCArtboard id="cow" label="06 · Detalhe da Vaca" width={414} height={868}>
          <Frame time="08:44"><CowDetailScreen/></Frame>
        </DCArtboard>
        <DCArtboard id="hist" label="07 · Histórico (Tabela)" width={414} height={868}>
          <Frame time="08:44"><HistoryScreen/></Frame>
        </DCArtboard>
      </DCSection>

      <DCSection id="watch" title="Alertas & Mapa">
        <DCArtboard id="alerts" label="08 · Alertas" width={414} height={868}>
          <Frame time="08:45"><AlertsScreen/></Frame>
        </DCArtboard>
        <DCArtboard id="map" label="09 · Mapa da Fazenda" width={414} height={868}>
          <Frame time="08:45"><MapScreen/></Frame>
        </DCArtboard>
      </DCSection>

      <DCSection id="account" title="Conta">
        <DCArtboard id="profile" label="10 · Perfil" width={414} height={868}>
          <Frame time="08:46"><ProfileScreen/></Frame>
        </DCArtboard>
        <DCArtboard id="settings" label="11 · Configurações" width={414} height={868}>
          <Frame time="08:46"><SettingsScreen/></Frame>
        </DCArtboard>
      </DCSection>

      <DCSection id="states" title="Estados (vazio · loading · erro)">
        <DCArtboard id="empty" label="12a · Vazio" width={414} height={868}>
          <Frame time="08:47"><StateEmpty/></Frame>
        </DCArtboard>
        <DCArtboard id="loading" label="12b · Sincronizando" width={414} height={868}>
          <Frame time="08:47"><StateLoading/></Frame>
        </DCArtboard>
        <DCArtboard id="error" label="12c · Sem conexão" width={414} height={868}>
          <Frame time="08:47"><StateError/></Frame>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
