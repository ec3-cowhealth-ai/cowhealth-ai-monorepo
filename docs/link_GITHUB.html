<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CowHealth AI - Links</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 60px 40px;
      text-align: center;
      max-width: 500px;
      width: 100%;
    }

    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
      font-weight: 700;
    }

    .links-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    .btn i {
      font-size: 20px;
    }

    .btn-github {
      background: #333;
      color: white;
    }

    .btn-github:hover {
      background: #555;
    }

    .btn-trello {
      background: #0079bf;
      color: white;
    }

    .btn-trello:hover {
      background: #0066a0;
    }

    @media (max-width: 480px) {
      .container {
        padding: 40px 20px;
      }

      h1 {
        font-size: 24px;
      }

      .btn {
        padding: 14px 24px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CowHealth AI</h1>
    <div class="links-section">
      <a href="https://github.com/ec3-cowhealth-ai/cowhealth-ai-monorepo" class="btn btn-github" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-github"></i>
        Ver no GitHub
      </a>
      <a href="https://trello.com/b/qbr8aru3/ec3-cowhealthai" class="btn btn-trello" target="_blank" rel="noopener noreferrer">
        <i class="fab fa-trello"></i>
        Acessar Trello
      </a>
    </div>
  </div>
</body>
</html>
